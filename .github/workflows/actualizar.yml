name: Actualizar convocatorias

on:
  schedule:
    # Cuatro intentos al día (GitHub a veces retrasa o se salta las tareas programadas; cada intento solo lee lo nuevo):
    # 07:40, 11:40, 15:40 y 19:40 UTC = 08:40, 12:40, 16:40 y 20:40 en invierno (una hora más en verano), hora de Madrid
    - cron: "40 7,11,15,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pdftotext y OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa

      - name: Descargar boletines y generar el listado
        run: python scraper/actualizar.py

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización diaria $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
