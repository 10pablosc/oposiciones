name: Diagnóstico (temporal)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Descargar textos
        run: python scraper/diagnostico.py
      - name: Subir a la rama diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostico
          git rm -rq --cached .
          git add diag
          git commit -qm "Textos para diagnóstico"
          git push -f origin diagnostico
